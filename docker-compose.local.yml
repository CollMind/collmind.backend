# Local test için Docker Compose dosyası
# Kullanım: docker-compose -f docker-compose.local.yml up --build

services:
  postgres:
    image: postgres:16
    container_name: collmind-tpm-postgres-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: collmind_tpm
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
      - postgres_logs_local:/var/log/postgresql
      - ./docker/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql
    # K1b (Z52 §3) — bkz. docker-compose.yml aynı bloğun gerekçe yorumu.
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_directory=/var/log/postgresql
      - -c
      - log_filename=postgresql-%Y-%m-%d_%H%M%S.log
      - -c
      - log_line_prefix=%m [%p] %u@%d %a
      - -c
      - log_connections=on
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collmind-tpm-backend-local
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: collmind_tpm
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SCHEMA: main
      DB_SSL: 'false'
      JWT_SECRET: local-test-secret-key
      JWT_EXPIRATION: 24h
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data_local:
  postgres_logs_local:
